[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "matt-in-1-pdf-generator"
version = "0.1.0"
description = "Erzeugt druckbare deutsche Matt-in-1-Schachraetsel als A4-PDF."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Matthias" }]
dependencies = [
  "reportlab>=4.0",
  "svglib>=1.5",
]

[project.scripts]
matt-in-1-pdf = "matt_in_1_pdf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"matt_in_1_pdf" = ["assets/cburnett/*.svg"]

[tool.pytest.ini_options]
pythonpath = ["src"]
